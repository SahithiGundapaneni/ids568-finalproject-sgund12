# prometheus.yml
# Prometheus scrape configuration for LLM Inference API monitoring
# IDS 568 Final Project - sgund12

global:
  scrape_interval: 15s       # Pull metrics every 15 seconds
  evaluation_interval: 15s   # Evaluate alerting rules every 15 seconds

alerting:
  alertmanagers:
    - static_configs:
        - targets: []          # Add alertmanager host here in production

rule_files:
  - "alert_rules.yml"          # Alert rules defined separately

scrape_configs:
  # Scrape the LLM inference API instrumentation endpoint
  - job_name: 'llm_inference_api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: /metrics
    scheme: http

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
